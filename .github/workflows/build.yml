name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential ccache cmake \
            libncurses5-dev libssl-dev libffi-dev libsqlite3-dev zlib1g-dev \
            libbz2-dev libreadline-dev liblzma-dev pkg-config autoconf automake libtool

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel cython virtualenv
          python -m pip install buildozer

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeaGuardian-apk
          path: bin/*.apk
